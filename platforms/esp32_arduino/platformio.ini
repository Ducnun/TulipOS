[platformio]
src_dir = .

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
prog_name = TulipOS
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Force the LDF to scan deep into symlinks
lib_ldf_mode = deep+

build_flags = 
    -DESP32
    -ffast-math
    -Icore/include
    -Ihardware_drivers
    -I.

build_src_filter =
    +<main.cpp>
    +<esp32_host.cpp>
    +<hardware_drivers/*.cpp>
    +<core/src/**/*.cpp>